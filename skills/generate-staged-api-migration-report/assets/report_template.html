<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --paper: #fffdf8;
      --ink: #1f1a17;
      --muted: #6c6258;
      --line: #d8ccbd;
      --accent: #9a3412;
      --accent-soft: #f6d6b8;
      --warn: #b45309;
      --fail: #b91c1c;
      --pass: #166534;
      --blocked: #7c3aed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(154, 52, 18, 0.16), transparent 28%),
        linear-gradient(180deg, #efe5d8 0%, var(--bg) 100%);
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 36px 20px 72px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(154, 52, 18, 0.12), rgba(255, 253, 248, 0.9));
      border: 1px solid rgba(154, 52, 18, 0.15);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 16px 50px rgba(31, 26, 23, 0.08);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .summary-card {
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(216, 204, 189, 0.8);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-card .value {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
    }

    .toc,
    .panel {
      margin-top: 24px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(31, 26, 23, 0.06);
    }

    .toc ul,
    .panel ul {
      margin: 12px 0 0;
      padding-left: 20px;
    }

    .toc a {
      color: var(--accent);
      text-decoration: none;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .panel p,
    .panel li {
      line-height: 1.7;
    }

    .panel a,
    .toc a {
      color: var(--accent);
      font-weight: 700;
    }

    .interface-block {
      padding: 18px 20px;
      border: 1px solid rgba(216, 204, 189, 0.9);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 253, 248, 0.95), rgba(248, 239, 228, 0.72));
      margin-top: 14px;
    }

    .interface-block h3 {
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .conclusion-grid {
      display: grid;
      grid-template-columns: minmax(180px, 0.9fr) minmax(220px, 1.1fr) minmax(320px, 2fr);
      gap: 16px;
      align-items: start;
    }

    .conclusion-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .conclusion-value {
      line-height: 1.7;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .conclusion-summary .status {
      margin-right: 8px;
      vertical-align: middle;
    }

    .section-note {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-left: 4px solid rgba(154, 52, 18, 0.55);
      background: rgba(248, 239, 228, 0.72);
      color: var(--muted);
    }

    .rule-group {
      margin-top: 18px;
      padding-top: 4px;
    }

    .rule-group h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.4;
    }

    .detail-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(154, 52, 18, 0.1);
      text-decoration: none;
      line-height: 1.35;
      min-width: 92px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0;
      font-size: 14px;
      background: white;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      margin-top: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(154, 52, 18, 0.28) transparent;
    }

    .table-wrap::-webkit-scrollbar {
      height: 8px;
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: rgba(154, 52, 18, 0.25);
      border-radius: 999px;
    }

    .data-table.standard {
      table-layout: auto;
    }

    .data-table.key-value {
      min-width: 760px;
      table-layout: fixed;
    }

    .data-table.wide {
      min-width: 980px;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th {
      background: #f8efe4;
      font-weight: 700;
    }

    .col-source-name {
      width: 168px;
    }

    .col-count {
      width: 78px;
      white-space: nowrap;
    }

    .col-status {
      width: 110px;
      white-space: nowrap;
    }

    .col-action {
      width: 136px;
      white-space: nowrap;
    }

    .col-path {
      width: 205px;
    }

    .col-primary-field-list {
      width: 225px;
      min-width: 225px;
    }

    .col-secondary-field-list {
      width: 145px;
      min-width: 145px;
    }

    .col-field-list {
      width: 190px;
      min-width: 190px;
    }

    .col-note {
      width: 245px;
      min-width: 245px;
    }

    .data-table.key-value th:first-child,
    .data-table.key-value td:first-child {
      width: 220px;
      min-width: 190px;
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .data-table.key-value th:nth-child(2),
    .data-table.key-value td:nth-child(2) {
      width: auto;
      min-width: 520px;
    }

    .muted {
      color: var(--muted);
    }

    .chip-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: stretch;
    }

    .cell-scroll {
      max-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(154, 52, 18, 0.28) transparent;
    }

    .cell-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .cell-scroll::-webkit-scrollbar-thumb {
      background: rgba(154, 52, 18, 0.22);
      border-radius: 999px;
    }

    .field-scroll {
      min-width: 0;
    }

    .plain-field-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }

    .plain-field-line {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .field-pair-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }

    .field-pair-line {
      display: grid;
      grid-template-columns: minmax(92px, 1.1fr) minmax(76px, 0.9fr);
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(190, 176, 159, 0.45);
      align-items: start;
    }

    .field-pair-line:last-child {
      border-bottom: 0;
    }

    .field-pair-line code {
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      background: transparent;
      padding: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .field-pair-line span {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .chip {
      display: block;
      width: 100%;
      padding: 2px 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(190, 176, 159, 0.45);
      font-size: 12px;
      line-height: 1.45;
      color: #5b5148;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status.PASS {
      background: rgba(22, 101, 52, 0.12);
      color: var(--pass);
    }

    .status.WARN {
      background: rgba(180, 83, 9, 0.14);
      color: var(--warn);
    }

    .status.FAIL {
      background: rgba(185, 28, 28, 0.14);
      color: var(--fail);
    }

    .status.BLOCKED,
    .status.N\/A {
      background: rgba(124, 58, 237, 0.12);
      color: var(--blocked);
    }

    pre {
      overflow: auto;
      padding: 16px;
      border-radius: 16px;
      background: #2b2623;
      color: #f8efe4;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      .page {
        padding: 24px 14px 48px;
      }

      .hero,
      .toc,
      .panel {
        padding: 18px;
        border-radius: 18px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .conclusion-grid {
        grid-template-columns: 1fr;
      }

      .data-table.wide {
        min-width: 860px;
      }

      .data-table.key-value {
        min-width: 720px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
      <div class="summary-grid">
        {{summary_cards}}
      </div>
    </section>

    <section class="toc">
      <h2>目录</h2>
      {{toc}}
    </section>

    {{sections}}
  </div>
</body>
</html>
