<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #edf2f7;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #52637a;
      --line: #cbd7e6;
      --accent: #1d4ed8;
      --accent-soft: #bfdbfe;
      --warn: #b45309;
      --fail: #dc2626;
      --pass: #0f766e;
      --blocked: #b45309;
      --surface: #f3f6fa;
      --surface-strong: #e7edf4;
      --row-hover: #fff1a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #e7edf4 0%, var(--bg) 100%);
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 36px 20px 72px;
    }

    .hero {
      background: var(--paper);
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .summary-card {
      padding: 16px 18px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      font-weight: 700;
    }

    .summary-card .value {
      margin-top: 8px;
      font-size: 20px;
      font-weight: 700;
    }

    .toc,
    .panel {
      margin-top: 24px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.07);
    }

    .detail-layout {
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .detail-content {
      min-width: 0;
    }

    .side-toc {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 18px;
    }

    .side-toc h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.35;
    }

    .toc ul,
    .panel ul {
      margin: 12px 0 0;
      padding-left: 20px;
    }

    .toc a {
      color: var(--accent);
      text-decoration: none;
    }

    .toc ul {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-left: 0;
      list-style: none;
    }

    .toc li {
      margin: 0;
    }

    .toc a {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      line-height: 1.35;
    }

    .side-toc ul {
      flex-direction: column;
      align-items: stretch;
      margin-top: 0;
    }

    .side-toc a {
      width: 100%;
      justify-content: flex-start;
      font-size: 13px;
      font-weight: 700;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .panel p,
    .panel li {
      line-height: 1.7;
    }

    .panel a,
    .toc a {
      color: var(--accent);
      font-weight: 700;
    }

    .interface-block {
      padding: 18px 20px;
      border: 1px solid rgba(203, 215, 230, 0.95);
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff, var(--surface));
      margin-top: 14px;
    }

    .interface-block h3 {
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .conclusion-grid {
      display: grid;
      grid-template-columns: minmax(180px, 0.9fr) minmax(220px, 1.1fr) minmax(320px, 2fr);
      gap: 16px;
      align-items: start;
    }

    .conclusion-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .conclusion-value {
      line-height: 1.7;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .conclusion-summary .status {
      margin-right: 8px;
      vertical-align: middle;
    }

    .section-note {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-left: 4px solid rgba(37, 99, 235, 0.55);
      background: #eaf2ff;
      color: var(--muted);
    }

    .rule-group {
      margin-top: 18px;
      padding-top: 4px;
    }

    .rule-group h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.4;
    }

    .detail-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.08);
      text-decoration: none;
      line-height: 1.35;
      min-width: 92px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0;
      font-size: 14px;
      background: white;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      margin-top: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(37, 99, 235, 0.3) transparent;
    }

    .table-wrap::-webkit-scrollbar {
      height: 8px;
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: rgba(37, 99, 235, 0.28);
      border-radius: 999px;
    }

    .data-table.standard {
      table-layout: auto;
    }

    .data-table.key-value {
      min-width: 760px;
      table-layout: fixed;
    }

    .data-table.wide {
      min-width: 1280px;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    th {
      background: var(--surface-strong);
      font-weight: 700;
    }

    tbody tr:nth-child(even) {
      background: #f7faff;
    }

    tbody tr td {
      transition: background-color 120ms ease;
    }

    tbody tr:hover td {
      background: var(--row-hover);
    }

    .col-source-name {
      width: 168px;
    }

    .col-count {
      width: 96px;
      white-space: nowrap;
    }

    .col-status {
      width: 88px;
      white-space: nowrap;
    }

    .col-db-field {
      width: 136px;
      min-width: 136px;
      overflow-wrap: break-word;
      word-break: normal;
    }

    .col-field-name {
      width: 112px;
      min-width: 112px;
      word-break: normal;
    }

    .col-assignment-type {
      width: 84px;
      min-width: 84px;
    }

    .col-validation-level {
      width: 78px;
      min-width: 78px;
    }

    .col-action {
      width: 136px;
      white-space: nowrap;
    }

    .col-path {
      width: 205px;
    }

    .col-primary-field-list {
      width: 225px;
      min-width: 225px;
    }

    .col-secondary-field-list {
      width: 145px;
      min-width: 145px;
    }

    .col-field-list {
      width: 190px;
      min-width: 190px;
    }

    .col-note {
      width: 205px;
      min-width: 205px;
    }

    .data-table.key-value th:first-child,
    .data-table.key-value td:first-child {
      width: 220px;
      min-width: 190px;
      max-width: 260px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .data-table.key-value th:nth-child(2),
    .data-table.key-value td:nth-child(2) {
      width: auto;
      min-width: 520px;
    }

    .muted {
      color: var(--muted);
    }

    .chip-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: stretch;
    }

    .cell-scroll {
      max-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(37, 99, 235, 0.3) transparent;
    }

    .cell-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .cell-scroll::-webkit-scrollbar-thumb {
      background: rgba(37, 99, 235, 0.24);
      border-radius: 999px;
    }

    .field-scroll {
      min-width: 0;
    }

    .plain-field-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
    }

    .plain-field-line {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .field-pair-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
    }

    .field-pair-line {
      display: grid;
      grid-template-columns: minmax(92px, 1.1fr) minmax(76px, 0.9fr);
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      align-items: start;
    }

    .field-pair-line:last-child {
      border-bottom: 0;
    }

    .field-pair-line code {
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      color: var(--ink);
      background: transparent;
      padding: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .field-pair-line span {
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .chip {
      display: block;
      width: 100%;
      padding: 2px 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      font-size: 12px;
      line-height: 1.45;
      color: #475569;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status.PASS {
      background: rgba(22, 101, 52, 0.12);
      color: var(--pass);
    }

    .status.WARN {
      background: rgba(180, 83, 9, 0.14);
      color: var(--warn);
    }

    .status.FAIL {
      background: rgba(185, 28, 28, 0.14);
      color: var(--fail);
    }

    .status.BLOCKED,
    .status.N\/A {
      background: rgba(180, 83, 9, 0.14);
      color: var(--blocked);
    }

    .status.N\/A {
      background: rgba(100, 116, 139, 0.14);
      color: #475569;
    }

    pre {
      overflow: auto;
      padding: 16px;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .detail-layout {
        grid-template-columns: 1fr;
      }

      .side-toc {
        position: static;
        max-height: none;
        order: -1;
      }

      .side-toc ul {
        flex-direction: row;
      }

      .side-toc a {
        width: auto;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 24px 14px 48px;
      }

      .hero,
      .toc,
      .panel {
        padding: 18px;
        border-radius: 10px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .conclusion-grid {
        grid-template-columns: 1fr;
      }

      .data-table.wide {
        min-width: 1180px;
      }

      .data-table.key-value {
        min-width: 720px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
      <div class="summary-grid">
        {{summary_cards}}
      </div>
    </section>

    {{body_content}}
  </div>
</body>
</html>
