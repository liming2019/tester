<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      color-scheme: light;
      --text: #20242b;
      --muted: #667085;
      --line: #d8dee8;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --header: #111827;
      --pass: #067647;
      --warn: #b54708;
      --fail: #b42318;
      --blocked: #53389e;
      --info: #175cd3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.58;
    }
    header {
      background: var(--header);
      color: #fff;
      padding: 30px 36px;
    }
    header h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0; }
    header p { margin: 0; color: #d6dce8; }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 28px 44px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin: 0 0 18px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 19px;
      letter-spacing: 0;
    }
    p { margin: 0 0 12px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
      min-height: 80px;
    }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .value { margin-top: 6px; font-size: 22px; font-weight: 700; overflow-wrap: anywhere; }
    .table-wrap { width: 100%; overflow-x: auto; margin: 10px 0 0; }
    .table-meta table {
      min-width: 860px;
    }
    .table-meta th:first-child,
    .table-meta td:first-child {
      width: 168px;
      min-width: 168px;
      max-width: 240px;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }
    .table-scroll {
      max-height: 680px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fff;
      scrollbar-gutter: stable;
    }
    .table-scroll table {
      margin: 0;
      border-collapse: separate;
      border-spacing: 0;
    }
    .table-scroll th {
      position: sticky;
      top: 0;
      z-index: 3;
      box-shadow: 0 1px 0 var(--line);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: #fff;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    th {
      background: #eef2f7;
      font-weight: 700;
      white-space: nowrap;
    }
    code {
      background: #eef2f7;
      border: 1px solid #d8dee8;
      border-radius: 4px;
      padding: 1px 4px;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }
    .pass { background: var(--pass); }
    .warn { background: var(--warn); }
    .fail { background: var(--fail); }
    .blocked { background: var(--blocked); }
    .na { background: var(--muted); }
    .note { color: var(--muted); }
    .diff-summary {
      display: grid;
      gap: 6px;
      max-width: 900px;
    }
    .diff-scroll {
      max-height: 520px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      padding: 4px 10px 4px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .diff-list {
      margin: 4px 0 0 18px;
      padding: 0;
    }
    .diff-scroll .diff-list {
      margin-top: 0;
    }
    .diff-list li {
      margin: 2px 0;
      line-height: 1.45;
    }
    .diff-field-line {
      margin-bottom: 3px;
    }
    .diff-samples {
      margin: 3px 0 8px 18px;
      padding-left: 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .diff-samples li {
      margin: 1px 0;
      line-height: 1.45;
    }
    .sample-kv {
      display: block;
      margin: 2px 0;
      color: var(--text);
    }
    .diff-samples code {
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .diff-sample-note {
      margin: 2px 0 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .compact-list {
      margin: 0;
      padding-left: 18px;
    }
    .compact-list li {
      margin: 2px 0;
      line-height: 1.45;
    }
    .kv-key {
      color: var(--muted);
      font-weight: 600;
    }
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: flex-start;
    }
    a { color: var(--info); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { color: var(--muted); font-size: 12px; padding: 0 28px 28px; text-align: center; }
    @media (max-width: 720px) {
      header { padding: 24px 18px; }
      main { padding: 18px 14px 32px; }
      section { padding: 16px; }
      table { min-width: 680px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    <p>{{subtitle}}</p>
  </header>
  <main>
    {{body}}
  </main>
  <footer>{{footer}}</footer>
</body>
</html>
